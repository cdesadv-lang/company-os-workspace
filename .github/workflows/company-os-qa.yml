name: Company OS QA
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    name: company-os-qa
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Pull trusted test runtime
        run: docker pull node:24-alpine
      - name: Run generated tests without network or secrets
        run: >-
          docker run --rm --network none --read-only --cap-drop ALL
          --security-opt no-new-privileges --pids-limit 128 --memory 256m --cpus 1
          --user 1000:1000 --workdir /workspace -v "$PWD/src/generated:/workspace:ro"
          node:24-alpine node --test
